<!DOCTYPE html>
<html>
  <head>
    <title>c'est un jeu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="app">
      <span class="text warning-text"></span>
    </div>
  </body>
  <script>
    const userLang = navigator.language || navigator.userLanguage;
    let langFile = "lang/en_us.json";

    if (userLang.startsWith("fr")) {
      langFile = "lang/fr_fr.json";
    }

    fetch(langFile)
      .then(response => {
        if (!response.ok) {
          throw new Error("Impossible de charger le fichier de langue");
        }
        return response.json();
      })
      .then(data => {
        $(".warning-text").html(data["menu.warningText"]);
        $(".warning-text").fadeIn(1000);
        setTimeout(() => {
          $(".warning-text").fadeOut(1000);
        }, 5000);
      })
      .catch(error => {
        console.error("Erreur de traduction:", error);
        $(".warning-text").html("WARNING: Error loading language file.");
        $(".warning-text").fadeIn(1000);
      });
  </script>
</html>
