<!DOCTYPE html>
<html>
  <head>
    <title>c'est un jeu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="app">
      <div class="subtitles-container">
        <span class="text game-subtitle"></span>
      </div>
      <span class="text warning-text"></span>
    </div>
  </body>
  <script>
    const translations = {
      "en": {
        "menu.warningText": "WARNING: This game is unofficial and was made by fans.<br><br>All original rights to images and names belong strictly to Draw Me A Pixel.",
        "menu.saveWarningText": "When this icon appears, exit the program immediately to<br>maximize your chances of corrupting your autosave.<br>Thank you.",
        "dialog.001": "A game, but..?!",
        "dialog.002": "THERE IS NO GAME!",
        "dialog.003": "User? Are you there? Again?.."
      },
      "fr": {
        "menu.warningText": "ATTENTION : Ce jeu n'est pas officiel et a<br>été réalisé par des fans.<br><br>Tous droits originaux de l'image, nom et<br>autres sont strictement réservés <br>à Draw Me A Pixel",
        "menu.saveWarningText": "Lorsque cette icône apparaît, quittez immédiatement le<br>programme afin de maximiser vos chances de corrompre<br>votre sauvegarde automatique.<br>Merci.<br>",
        "dialog.001": "Un jeu, mais..?!",
        "dialog.002": "IL N'Y A PAS DE JEU!",
        "dialog.003": "Utilisateur? Vous êtes là? À nouveau?.."
      }
    };

    const userLang = navigator.language || navigator.userLanguage;
    const lang = userLang.startsWith("fr") ? "fr" : "en";
    const data = translations[lang];

    $(".warning-text").html(data["menu.warningText"]).fadeIn(1000);

    setTimeout(() => {
      $(".app").addClass("shake-effect");
      $(".game-subtitle").html(data["dialog.001"]).show();
      setTimeout(() => {
        $(".app").removeClass("shake-effect");
      }, 300);
    }, 2500);

    setTimeout(() => {
      $(".warning-text").fadeOut(1000, () => {
        $(".game-subtitle").hide();

        setTimeout(() => {
          $(".app").addClass("shake-effect");
          setTimeout(() => {
            $(".app").removeClass("shake-effect");
            $(".app").addClass("shake-effect");
            $(".game-subtitle").html(data["dialog.002"]).show();
            setTimeout(() => {
              $(".app").removeClass("shake-effect");
              setTimeout(() => {
                $(".game-subtitle").hide();
                setTimeout(() => {
                  $(".game-subtitle").html(data["dialog.003"]).show();
                  $(".warning-text").html(data["menu.saveWarningText"]).fadeIn(1000);
                }, 1000);

              }, 1500);
            }, 500);
          }, 150);
        }, 200);
      });
    }, 6500);
  </script>
</html>
