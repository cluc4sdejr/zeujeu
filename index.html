<!DOCTYPE html>
<html>
  <head>
    <title>c'est un jeu</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
  </head>
  <body>
    <img class="tape-left" src="assets/tapes.gif">
    <img class="tape-right" src="assets/tapes.gif">

    <div class="start-screen" id="start-screen">
      <div class="start-screen-content">
        <div class="start-screen-title">Lancer</div>
        <button id="start-button">Lancer</button>
      </div>
    </div>

    <div class="app">
      <div class="subtitles-container">
        <span class="text game-subtitle"></span>
      </div>
      <span class="text warning-text"></span>
      <img class="save-icon" src="assets/saving.gif" style="display: none; margin: 60px auto 0 auto;">
    </div>
  </body>
  <script>
    const translations = {
      "en": {
        "menu.warningText": "WARNING: This game is unofficial and was<br>made by fans.<br><br>All original rights to images and names<br>belong strictly to Draw Me A Pixel.",
        "menu.saveWarningText": "When this icon appears, exit the program immediately to<br>maximize your chances of corrupting your autosave.<br>Thank you.",
        "dialog.001": 'A "game", but..?!',
        "dialog.002": "THERE IS NO GAME!",
        "dialog.003": "User? Are you there? Again?.."
      },
      "fr": {
        "menu.warningText": "ATTENTION : Ce jeu n'est pas officiel et a<br>été réalisé par des fans.<br><br>Tous droits originaux de l'image, nom et<br>autres sont strictement réservés <br>à Draw Me A Pixel",
        "menu.saveWarningText": "Lorsque cette icône apparaît, quittez immédiatement le<br>programme afin de maximiser vos chances de corrompre<br>votre sauvegarde automatique.<br>Merci.<br>",
        "dialog.001": 'Un "jeu", mais..?!',
        "dialog.002": "IL N'Y A PAS DE JEU!",
        "dialog.003": "Utilisateur? Vous êtes là? À nouveau?.."
      }
    };

    const dialogAudioMap = {
      "dialog.001": "sfx/voices/Game_dialog.001.wav",
      "dialog.002": "sfx/voices/Game_dialog.002.wav"
    };

    const dialogAudios = {};
    const userLang = navigator.language || navigator.userLanguage;
    const lang = userLang.startsWith("fr") ? "fr" : "en";
    const data = translations[lang];

    const preloadDialogAudio = () => {
      Object.entries(dialogAudioMap).forEach(([key, src]) => {
        const audio = new Audio(src);
        audio.preload = "auto";
        audio.load();
        dialogAudios[key] = audio;
      });
    };

    const unlockAudio = () => {
      Object.values(dialogAudios).forEach(audio => {
        audio.currentTime = 0;
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
        }).catch(() => {
          // Ignore autoplay errors.
        });
      });
    };

    const playDialogAudio = (dialogKey) => {
      const audio = dialogAudios[dialogKey];
      if (!audio) return;
      audio.currentTime = 0;
      audio.play().catch(() => {
        // Ignore playback failures.
      });
    };

    const showDialog = (dialogKey) => {
      $(".game-subtitle").html(data[dialogKey]).show();
      playDialogAudio(dialogKey);
    };

    const runSequence = () => {
      $(".warning-text").html(data["menu.warningText"]).fadeIn(1000);

      setTimeout(() => {
        $(".app").addClass("shake-effect");
      $(".game-subtitle").html(data["dialog.001"]).show();
      setTimeout(() => {
        $(".app").removeClass("shake-effect");
      }, 300);
    }, 2500);

    setTimeout(() => {
      $(".warning-text").fadeOut(1000, () => {
        $(".game-subtitle").hide();
        setTimeout(() => {
          $(".app").addClass("shake-effect");
          setTimeout(() => {
            $(".app").removeClass("shake-effect");
            $(".app").addClass("shake-effect");
            $(".game-subtitle").html(data["dialog.002"]).show();
            setTimeout(() => {
              $(".app").removeClass("shake-effect");
              setTimeout(() => {
                $(".game-subtitle").hide();
                setTimeout(() => {
                  $(".game-subtitle").html(data["dialog.003"]).show();
                  $(".warning-text").html(data["menu.saveWarningText"]).fadeIn(1000);
                  $(".save-icon").fadeIn(1000);
                  setTimeout(() => {
                    $(".game-subtitle").hide();
                    $(".warning-text").fadeOut(1000);
                    $(".save-icon").fadeOut(1000);
                    $(".tape-left").addClass("slide-out-left");
                    $(".tape-right").addClass("slide-out-right");
                  }, 4000);
                }, 1000);
              }, 1500);
            }, 500);
          }, 150);
        }, 200);
      });
    }, 6500);
    };

    $(document).ready(() => {
      $("#start-button").on("click", () => {
        preloadDialogAudio();
        unlockAudio();
        $("#start-screen").fadeOut(250, function() {
          $(this).remove();
          runSequence();
        });
      });
    });
  </script>
</html>
